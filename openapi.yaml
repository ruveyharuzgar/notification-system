{
  "openapi": "3.0.3",
  "info": {
    "title": "Notification API",
    "version": "3.0.0",
    "description": "Asynchronous notification API; HTTP 202 is provider acceptance or API enqueue acceptance, not delivery."
  },
  "servers": [
    {
      "url": "http://localhost:8000/api"
    }
  ],
  "paths": {
    "/notifications": {
      "get": {
        "responses": {
          "200": {
            "description": "Success"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "channel",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "to",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer"
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "schema": {
              "type": "integer"
            }
          }
        ]
      },
      "post": {
        "responses": {
          "202": {
            "description": "Accepted for asynchronous processing",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NotificationInput"
              },
              "example": {
                "recipient": "+905551234567",
                "channel": "sms",
                "content": "Hello",
                "priority": "high"
              }
            }
          }
        }
      }
    },
    "/notifications/batch": {
      "post": {
        "responses": {
          "202": {
            "description": "Accepted for asynchronous processing",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "notifications"
                ],
                "properties": {
                  "notifications": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 1000,
                    "items": {
                      "$ref": "#/components/schemas/NotificationInput"
                    }
                  }
                }
              },
              "example": {
                "notifications": [
                  {
                    "recipient": "test@example.test",
                    "channel": "email",
                    "content": "Hello",
                    "priority": "normal"
                  }
                ]
              }
            }
          }
        }
      }
    },
    "/notifications/{id}": {
      "get": {
        "responses": {
          "200": {
            "description": "Success"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/notifications/{id}/cancel": {
      "post": {
        "responses": {
          "200": {
            "description": "Success"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/batches/{id}": {
      "get": {
        "responses": {
          "200": {
            "description": "Success"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        ]
      }
    },
    "/metrics": {
      "get": {
        "responses": {
          "200": {
            "description": "Current queue depth and rolling 24-hour outcome metrics"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          }
        }
      }
    },
    "/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Success"
          },
          "422": {
            "description": "Validation error"
          },
          "409": {
            "description": "Conflict"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Database or Redis unhealthy"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "NotificationInput": {
        "type": "object",
        "required": [
          "recipient",
          "channel",
          "content",
          "priority"
        ],
        "properties": {
          "recipient": {
            "type": "string",
            "maxLength": 255
          },
          "channel": {
            "type": "string",
            "enum": [
              "sms",
              "email",
              "push"
            ]
          },
          "content": {
            "type": "string",
            "maxLength": 10000,
            "description": "SMS 160, push 4096, email 10000 Unicode characters"
          },
          "priority": {
            "type": "string",
            "enum": [
              "high",
              "normal",
              "low"
            ]
          },
          "scheduled_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
      "CreateResponse": {
        "type": "object",
        "required": [
          "batch_id",
          "notifications"
        ],
        "properties": {
          "batch_id": {
            "type": "string",
            "format": "uuid"
          },
          "notifications": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "status": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    }
  }
}
