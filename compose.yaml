x-app: &app
  build: .
  env_file: &env
    - path: .env.example
      required: true
    - path: .env
      required: false
  depends_on:
    mock-provider:
      condition: service_healthy
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
services:
  mock-provider:
    build: .
    command: php -S 0.0.0.0:8080 mock/index.php
    restart: on-failure
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);']
      interval: 2s
      timeout: 2s
      retries: 20
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: [CMD-SHELL, 'mysql -uapp -papp notifications -e "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [dbdata:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [redisdata:/data]
  migrate:
    build: .
    env_file: *env
    depends_on:
      db:
        condition: service_healthy
    command: php artisan migrate --force
  api:
    <<: *app
    command: php -S 0.0.0.0:8000 -t public public/index.php
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    ports: ['127.0.0.1:8000:8000']
  worker:
    <<: *app
    command: php artisan queue:work redis --queue=high,normal,low --timeout=20 --sleep=1
    restart: on-failure
  worker-normal:
    <<: *app
    command: php artisan queue:work redis --queue=normal --timeout=20 --sleep=1
    restart: on-failure
  worker-low:
    <<: *app
    command: php artisan queue:work redis --queue=low --timeout=20 --sleep=1
    restart: on-failure
  dispatcher:
    <<: *app
    command: sh -c 'while true; do php artisan notifications:dispatch; sleep 1; done'
  test:
    build: .
    profiles: [test]
    env_file: *env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      RUN_REDIS_TESTS: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: composer test
volumes:
  dbdata:
  redisdata:
